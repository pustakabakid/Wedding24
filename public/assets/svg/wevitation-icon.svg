<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#C9A96E"/>

  <!-- Two interlocking wedding rings -->
  <!-- Left ring -->
  <circle cx="24" cy="34" r="10" fill="none" stroke="#fff" stroke-width="3.5"/>
  <!-- Right ring (overlapping) -->
  <circle cx="40" cy="34" r="10" fill="none" stroke="#fff" stroke-width="3.5"/>

  <!-- Overlap fill to create interlock illusion (left side covers right) -->
  <path d="M32 25.5 A10 10 0 0 0 32 42.5" fill="none" stroke="#C9A96E" stroke-width="4.5"/>

  <!-- Elegant "W" initial at top -->
  <text x="32" y="20" font-family="Georgia,serif" font-size="13" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.5">W</text>

  <!-- Small diamond sparkle top-right -->
  <polygon points="50,10 52,14 56,14 53,17 54,21 50,18 46,21 47,17 44,14 48,14"
           fill="#fff" opacity="0.9"/>
</svg>
